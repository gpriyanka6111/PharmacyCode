<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RxInsight — Success</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --brand:       #0f4c81;
      --brand-light: #1a6bb5;
      --brand-soft:  #e8f2ff;
      --brand-border:#c3d9f5;
      --accent:      #00c48c;
      --bg:          #f0f4f8;
      --surface:     #ffffff;
      --border:      #e2e8f0;
      --ink:         #1a202c;
      --muted:       #64748b;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--ink); margin: 0; min-height: 100vh; }

    .pt-navbar { background: var(--brand); padding: 10px 0; position: sticky; top: 0; z-index: 1050; }
    .pt-logo-box { background: rgba(255,255,255,0.18); color: #fff; font-weight: 700; font-size: 13px; width: 36px; height: 36px; border-radius: 8px; display: inline-grid; place-items: center; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.25); }
    .pt-brand-name { font-weight: 600; font-size: 1.05rem; color: #fff; line-height: 1.15; }
    .pt-brand-sub  { font-size: 0.72rem; color: rgba(255,255,255,0.65); }

    .success-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 57px); padding: 40px 16px; }
    .success-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(15,76,129,0.08);
    }
    .success-icon-wrap {
      width: 72px; height: 72px;
      background: #dcfce7;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      margin-bottom: 20px;
    }
    .success-icon-wrap i { font-size: 2rem; color: #16a34a; }
    .success-title { font-size: 1.5rem; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
    .success-message { font-size: 0.95rem; color: var(--muted); margin-bottom: 8px; line-height: 1.6; }
    .success-hint { font-size: 0.82rem; color: var(--muted); margin-bottom: 28px; }
    .btn-brand { background: var(--brand); border: none; color: #fff; font-weight: 500; padding: 10px 28px; border-radius: 8px; font-size: 0.88rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.15s all; font-family: 'DM Sans', sans-serif; text-decoration: none; }
    .btn-brand:hover { background: var(--brand-light); color: #fff; }

    .app-footer { text-align: center; font-size: 0.78rem; color: var(--muted); padding: 14px 0 20px; }

    .dark-mode { background: #121212; color: #eee; }
    .dark-mode .success-card { background: #1e1e1e; border-color: #333; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="pt-navbar">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <span class="pt-logo-box">Rx</span>
        <div>
          <div class="pt-brand-name">RxInsight</div>
          <div class="pt-brand-sub">Pharmacy profit intelligence</div>
        </div>
      </div>
      <a href="/" onclick="location.reload(true);" class="btn-brand" style="font-size:0.82rem;padding:6px 14px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);">
        <i class="bi bi-house"></i>Home
      </a>
    </div>
  </nav>

  <div class="success-wrap">
    <div class="success-card">
      <div class="success-icon-wrap">
        <i class="bi bi-check-circle-fill"></i>
      </div>
      <div class="success-title">Success!</div>
      <div class="success-message">{{ message }}</div>
      <div class="success-hint">Check your Downloads folder for the generated file.</div>
      <a href="/" onclick="location.reload(true);" class="btn-brand">
        <i class="bi bi-house"></i>Go back to home
      </a>
    </div>
  </div>

  <footer class="app-footer">© 2026 Developed by <strong>Priyanka Gulgari</strong></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function(){
      const btn=document.createElement('button'); btn.type='button';
      btn.className='btn btn-sm btn-outline-secondary position-fixed top-0 end-0 m-3';
      btn.style.zIndex=1081; btn.title='Toggle dark mode';
      btn.innerHTML='<i class="bi bi-moon"></i>';
      btn.onclick=()=>{ document.body.classList.toggle('dark-mode'); btn.innerHTML=document.body.classList.contains('dark-mode')?'<i class="bi bi-sun"></i>':'<i class="bi bi-moon"></i>'; };
      document.body.appendChild(btn);
    })();
  </script>
</body>
</html>
